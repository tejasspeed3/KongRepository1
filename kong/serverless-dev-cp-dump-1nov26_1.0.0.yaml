- connect_timeout: 60000
  enabled: true
  host: httpbin.org
  name: my-post-service
  path: /post
  port: 443
  protocol: https
  read_timeout: 60000
  retries: 5
  routes:
  - https_redirect_status_code: 426
    methods:
    - POST
    name: my-post-route
    path_handling: v0
    paths:
    - /post
    plugins:
    - config:
        access:
        - |-
          local cjson = require("cjson.safe")
          kong.service.request.enable_buffering()
          local raw = kong.request.get_raw_body()
          local body = cjson.decode(raw)
          if type(body) == "table" then
            for _, item in ipairs(body) do
              if type(item) == "table" then
                item.route_id = nil
                if item.number == "KA0284" then
                  item.number = "AB0285"
                end
                item.name = "Ethiad"
              end
            end
            kong.service.request.set_raw_body(cjson.encode(body))
          end
          kong.service.request.set_header("X-flight-Code", "Fl-123")
        body_filter: []
        certificate: []
        functions: []
        header_filter: []
        log: []
        rewrite: []
        ws_client_frame: []
        ws_close: []
        ws_handshake: []
        ws_upstream_frame: []
